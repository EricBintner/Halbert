<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .eyebrow-dark { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; fill: #B8B2A6; text-transform: uppercase; }
      .title-dark { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 64px; font-weight: 700; letter-spacing: -0.035em; fill: #F7F5F0; }
      .dot-dark { fill: #D34E24; }
      .tagline-dark { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 23px; font-weight: 500; letter-spacing: -0.01em; fill: #D8D2C5; }
      .pill-text-dark { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 500; fill: #D8D2C5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1280" height="320" rx="20" fill="#1A1918" />
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#33312E" stroke-width="1" />

  <!-- Med-Large Mark (6 concentric tracks / 60% density tier) -->
  <g fill="none" stroke="#D34E24" stroke-width="11.67" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 180.00 55.00 V 160.00 M 159.00 57.12 V 160.00 A 21.00 21.00 0 0 0 201.00 160.00 V 57.12 M 138.00 63.77 V 160.00 A 42.00 42.00 0 0 0 222.00 160.00 V 63.77 M 117.00 76.00 V 160.00 A 63.00 63.00 0 0 0 243.00 160.00 V 76.00 M 96.00 97.00 V 160.00 A 84.00 84.00 0 0 0 264.00 160.00 V 97.00 M 75.00 160.00 A 105.00 105.00 0 0 0 285.00 160.00" />
  </g>

  <!-- Subtle divider hairline -->
  <line x1="330" y1="60" x2="330" y2="260" stroke="#33312E" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Typography Lockup -->
  <text x="370" y="95" class="eyebrow-dark">LOCAL-FIRST AI · FIRST-PERSON SYSTEM ADMINISTRATION</text>
  <text x="370" y="165" class="title-dark">Halbert<tspan class="dot-dark">.</tspan></text>
  <text x="370" y="206" class="tagline-dark">“You can call me AI.” <tspan font-weight="400" fill="#8C877D">— The computer speaking as itself.</tspan></text>

  <!-- Capability Badges -->
  <g transform="translate(370, 240)">
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#262422" stroke="#383532" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#2D7A56" />
    <text x="26" y="18" class="pill-text-dark">100% OFFLINE &amp; PRIVATE</text>

    <rect x="192" y="0" width="195" height="28" rx="6" fill="#262422" stroke="#383532" stroke-width="1" />
    <circle cx="206" cy="14" r="3.5" fill="#D34E24" />
    <text x="218" y="18" class="pill-text-dark">HOST SELF-DIAGNOSIS</text>

    <rect x="399" y="0" width="190" height="28" rx="6" fill="#262422" stroke="#383532" stroke-width="1" />
    <circle cx="413" cy="14" r="3.5" fill="#386C8A" />
    <text x="425" y="18" class="pill-text-dark">AUDITED WHY-ENGINE</text>

    <rect x="601" y="0" width="145" height="28" rx="6" fill="#262422" stroke="#383532" stroke-width="1" />
    <circle cx="615" cy="14" r="3.5" fill="#C4781C" />
    <text x="627" y="18" class="pill-text-dark">LINUX &amp; MACOS</text>
  </g>
</svg>