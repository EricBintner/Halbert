    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "author": {
          "@type": "Person",
          "name": "Eric Bintner"
        }
      }

    <!-- Self-hosted brand typefaces. Halbert is local-first; fetching faces from
