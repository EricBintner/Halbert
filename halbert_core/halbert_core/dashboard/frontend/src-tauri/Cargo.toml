[package]
name = "test-halbert"
version = "0.1.1"
description = "Halbert desktop dashboard (Tauri shell around the halbert-api sidecar)"
authors = ["Eric Bintner and Halbert Contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "test_halbert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Opt-in microphone capture with loopback TCP dispatch (audio workstream T2.3).
# Adds `cpal` (CoreAudio on macOS, ALSA on Linux).
voice-capture = ["dep:cpal"]
# Opt-in software acoustic echo cancellation on the capture path (T2.4), so
# Halbert's own Piper TTS output does not feed back into the microphone during
# voice barge-in. Adds `webrtc-audio-processing` with the `bundled` feature:
# building the bundled C++ needs clang, pkg-config, meson and ninja. On
# Apple Silicon machines whose Homebrew/toolchain is Intel (Rosetta), build
# with build_aec_arm64.sh so the C++ is compiled for arm64, not x86_64.
aec = ["voice-capture", "dep:webrtc-audio-processing"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
chrono = "0.4"
image = "0.25"
# Optional: microphone capture for the voice pipeline. Kept optional so the
# default build stays free of audio-hardware backends (subtractive contract).
cpal = { version = "0.18", optional = true }
# Optional: WebRTC AudioProcessing (AEC/AGC/NS). Tilde-req per upstream advice:
# the crate's minor versions may break API (its README recommends tilde reqs).
# `bundled` builds the C++ library from source (needs meson + ninja).
webrtc-audio-processing = { version = "~2.1", features = ["bundled"], optional = true }

# macOS-only: NSPanel conversion + CGEventTap hotkey monitor for the floating
# voice HUD. Versions match what tauri/wry already pull into Cargo.lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow"] }
core-graphics = "0.24"
core-foundation = "0.10"

