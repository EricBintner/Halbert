<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
          document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          document.documentElement.classList.toggle('dark', e.matches);
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Halbert.png" />
    <link rel="preload" href="/Halbert.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halbert Dashboard</title>
    <!-- Self-hosted brand typefaces. Halbert is local-first; fetching faces from
         a CDN at runtime contradicts that and fails outright in the packaged
         app. Synced from /shared-tokens/fonts by scripts/sync_fonts.py. -->
    <link rel="preload" href="/fonts/files/space-grotesk-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/files/jetbrains-mono-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
