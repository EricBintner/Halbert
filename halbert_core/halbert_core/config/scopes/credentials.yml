# credentials_admin — cloud and service credential files.
#
# Owns the files that answer "what credentials does this machine have":
# cloud provider configs, container registry auth, CLI tool credentials,
# SSH client config, and application environment files.
#
# These are the most common credential files on a developer's machine.
# Without this scope, the agent reads them via file-read tools, bypassing
# tier routing entirely — the trust boundary's biggest hole.
#
# SECURITY: Every file in this scope is expected to contain Tier 2 secrets.
# The staging pipeline redacts on egress (mcp_response), and the canon DB
# stores raw values only in the user-owned, localhost-only private index.
# The exclude block strips bare key material (*.pem, id_rsa*) that has no
# key names for redaction to match on.
#
# Deliberately NOT here:
#   * Private key FILES (*.pem, id_rsa*, *.key) — excluded outright. These
#     are binary-like blobs with no key=value structure; redaction cannot
#     protect them, and their content IS the secret. The exclude globs in
#     register_host_project.py already strip these; listing them here too
#     is defence in depth.
#   * ~/.ssh/authorized_keys — public keys, not secrets, but excluded to
#     avoid leaking which keys have access (operational data, not secret,
#     but not config-query-relevant either).
#   * Browser cookie stores, password manager databases — binary formats
#     that the parser cannot handle and that are better accessed through
#     their own tooling.
#
# (No `parsers:` block — Manifest.parsers is loaded but never consulted;
# format dispatch in config/parser.py is purely extension-based.)
#
# Design: .handoff/HALBERT-MCP-PLAN-2026-08-28.md (credentials scope)

include:
  # --- AWS ---------------------------------------------------------------
  - ~/.aws/credentials
  - ~/.aws/config

  # --- Kubernetes --------------------------------------------------------
  - ~/.kube/config

  # --- Google Cloud ------------------------------------------------------
  - ~/.config/gcloud/application_default_credentials.json
  - ~/.config/gcloud/credentials.db

  # --- Docker / container registries -------------------------------------
  - ~/.docker/config.json

  # --- CLI tool credentials ----------------------------------------------
  # netrc: API credentials for curl, wget, pip, npm, etc.
  - ~/.netrc

  # --- SSH client config (NOT keys — those are excluded) -----------------
  # ssh_config contains host aliases, proxy jumps, identity file paths —
  # operational data, not secrets. Identity file PATHS are Tier 1 (they
  # reveal machine structure), the key FILES themselves are excluded.
  - ~/.ssh/config

  # --- Application environment files -------------------------------------
  # .env files in common locations. These contain application secrets
  # (DATABASE_URL, API_KEY, SECRET_KEY). The glob catches .env, .env.local,
  # .env.production, etc. but NOT .env.example (which has no real secrets).
  - ~/.env
  - ~/.env.local
  - ~/.env.production
  - ~/.env.staging
  - ~/.config/halbert/.env

  # --- Git credential helpers --------------------------------------------
  - ~/.gitconfig
  - ~/.git-credentials

  # --- Package manager auth ----------------------------------------------
  # npm: auth tokens in .npmrc
  - ~/.npmrc
  # pip: index URLs with embedded credentials
  - ~/.pip/pip.conf
  - ~/.config/pip/pip.conf
  - ~/.pypirc

  # --- Cloud CLI configs -------------------------------------------------
  - ~/.config/doctl/config.yaml
  - ~/.config/linode-cli
  - ~/.config/hcloud/config.toml

  # --- Terraform / IaC ---------------------------------------------------
  # Terraform credentials file (tf cloud / terraform login)
  - ~/.terraform.d/credentials.tfrc.json
  - ~/.terraformrc

exclude:
  # Private key material — excluded outright, never staged.
  # These have no key=value structure for redaction to match on.
  - ~/.ssh/*.pem
  - ~/.ssh/*.key
  - ~/.ssh/id_rsa*
  - ~/.ssh/id_ecdsa*
  - ~/.ssh/id_ed25519*
  - ~/.ssh/id_dsa*
  - ~/.ssh/authorized_keys
  - ~/.ssh/known_hosts

  # .env.example files are templates, not real secrets.
  - ~/.env.example
  - ~/.env.template
  - ~/.env.sample
