[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halbert-core"
version = "0.1.1"
description = "Halbert Phase 1 runtime skeleton (agents, tools, ingestion, index, obs, eval)"
authors = [{ name = "Eric Bintner" }]
maintainers = [{ name = "Eric Bintner and Halbert Contributors" }]
# PEP 639 licence expression (setuptools >= 77). Full text: ../LICENSE
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]  # copy of ../LICENSE; PEP 639 forbids '..' here
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Logging/typing
  "pydantic>=2.6",
  # BM25 sparse retrieval for hybrid search
  "rank-bm25>=0.2.2",
  # Config parsing & watching
  "pyyaml>=6.0",
  "watchdog>=4.0",
  # JSON schema validation
  "jsonschema>=4.19",
  # Journald native reader (optional, falls back to journalctl)
  "systemd-python>=235; platform_system == 'Linux'",
  # numpy for embeddings
  "numpy>=1.24",
  # APScheduler for background task scheduling (Phase 23)
  "apscheduler>=3.10",
  # SQLAlchemy for APScheduler job persistence
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Lightweight install for N100/Pi/legacy hardware — no torch, no chromadb,
# no sentence-transformers. Ollama handles embeddings and local models.
# Cloud APIs handle heavy lifting. SourcePrep can run on a LAN machine.
light = [
  "halbert-core[dashboard]",
]

# RAG / vector search support (chromadb + sentence-transformers)
rag-legacy = [
  "chromadb>=0.5; python_version >= '3.10'",
  "sentence-transformers>=2.2",
]

# Full install: everything (rag-legacy + dashboard + cloud-apis + vision)
full = [
  "halbert-core[rag-legacy,dashboard,cloud-apis,vision]",
]

dashboard = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "httpx>=0.26",
  "requests>=2.31",
  "psutil>=5.9",
  "aiofiles>=23.2",
  "huggingface-hub>=0.20",  # Dataset downloads from HF Hub
]

# Phase 38: Cloud API providers (optional - install if using cloud models)
cloud-apis = [
  "anthropic>=0.39",           # Claude models (Anthropic)
  "openai>=1.50",              # GPT models (OpenAI)
  "google-generativeai>=0.8",  # Gemini models (Google)
]

# Context compression (replaces CLaRa — LLMLingua-2 neural token pruning)
compression = [
  "llmlingua>=0.2",
  "huggingface-hub>=0.20",
]

# Persona cognition layer (Haloysius). Not on PyPI — install from the sibling
# checkout: `.venv/bin/pip install -e /Volumes/4TB-BAD/Haloysius`. Every
# haloysius import in halbert_core/integrations is guarded, so the core runs
# without it (cognition tick, app seam, and state trackers are simply skipped).
cognition = [
  "haloysius>=0.2.0",
]

dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pyinstaller>=6.0",
]

# Screen capture + webcam for vision model input. MSS is ~50KB (ctypes,
# no native build). opencv-python is ~60MB but provides the JPEG encode
# pipeline and webcam capture. numpy is already a core dependency.
vision = [
  "mss>=9.0",
  "opencv-python>=4.8",
]

# Auditory cortex — sherpa-onnx for VAD/ASR/speaker-ID/audio-tagging/TTS.
# Zero PyTorch: sherpa-onnx uses ONNX Runtime only. GPU via ORT CUDA EP.
audio-inference = [
  "sherpa-onnx>=1.10",
  "onnxruntime>=1.16",
]

# Wake word spotting (openWakeWord). Requires a trained "Hey Halbert" model.
audio-wake-word = [
  "openwakeword>=0.6",
  "numpy>=1.24",
]

# Acoustic fingerprinting (Chromaprint + AcoustID). Requires network for lookup.
audio-fingerprint = [
  "pyacoustid>=1.3",
]

[project.scripts]
halbert = "halbert_core.dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["halbert_core*"]

# Non-Python files the runtime reads. Without this stanza a wheel built from
# this project contained 331 entries and not one non-.py file, so every data
# file inside the package was absent from every non-editable install --
# including sourceprep_template.yml, which registers the SourcePrep scopes.
# tests/test_config_roles.py fails if a manifest stops being covered here.
[tool.setuptools.package-data]
"halbert_core.config" = ["scopes/*.yml"]
"halbert_core.integrations" = ["*.yml"]
"halbert_core.prompts" = ["*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
