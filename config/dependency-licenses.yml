# =============================================================================
# Halbert Third-Party Dependency Licence Register
# =============================================================================
# The licence of every third-party library Halbert links or bundles, recorded
# so `scripts/check_appstore_deps.py` can assert that no strong-copyleft
# dependency reaches the Mac App Store target.
#
# Why this matters (LEG-CRIT-03): the GPLv3 §7 exception the project grants for
# App Store distribution covers *Halbert's own* code. It cannot grant an
# exception on someone else's GPL library. A single statically-linked GPL
# dependency in the App Store binary is an infringement no amount of
# Halbert-side licensing fixes.
#
# Rules the checker applies to the `macos-app-store` target:
#   - strong copyleft (GPL-2.0, GPL-3.0, AGPL, GFDL)  -> FAIL
#   - weak copyleft   (LGPL, MPL-2.0, EPL)            -> FAIL unless the entry
#                                                        is marked
#                                                        `dynamic_only: true`
#                                                        or excluded by a
#                                                        platform marker
#   - permissive      (MIT, BSD, Apache-2.0, ISC, …)  -> OK
#   - unknown / unlisted dependency                    -> FAIL (classify it)
#
# Keep this in step with `documentation/legal/THIRD-PARTY-LICENSES.md`: this
# file is the machine-readable half, that document is the human-readable notice
# shipped with the binary.
#
# `spdx` uses SPDX identifiers; dual licences use the SPDX `OR` form.
# =============================================================================

version: 1

# Licence classes the checker reasons about.
copyleft_classes:
  strong:
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - GFDL-1.3-or-later
    - SSPL-1.0
  weak:
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - LGPL-3.0-or-later
    - MPL-2.0
    - EPL-2.0
    - CDDL-1.0

# -----------------------------------------------------------------------------
# Python — halbert_core/pyproject.toml
# -----------------------------------------------------------------------------
python:
  pydantic: {spdx: MIT}
  chromadb: {spdx: Apache-2.0}
  sentence-transformers: {spdx: Apache-2.0}
  rank-bm25: {spdx: Apache-2.0}
  pyyaml: {spdx: MIT}
  watchdog: {spdx: Apache-2.0}
  jsonschema: {spdx: MIT}
  numpy: {spdx: BSD-3-Clause}
  apscheduler: {spdx: MIT}
  sqlalchemy: {spdx: MIT}

  systemd-python:
    spdx: LGPL-2.1-or-later
    platforms: [linux]
    notes: >-
      Weak copyleft, and the only copyleft dependency in the tree. Guarded in
      pyproject.toml by `platform_system == 'Linux'` so pip never installs it on
      macOS, and excluded explicitly by scripts/build-macos.sh
      (--exclude-module systemd). The checker verifies that marker is still
      present rather than trusting the convention.

  # [dashboard]
  fastapi: {spdx: MIT}
  uvicorn: {spdx: BSD-3-Clause}
  httpx: {spdx: BSD-3-Clause}
  requests: {spdx: Apache-2.0}
  psutil: {spdx: BSD-3-Clause}
  aiofiles: {spdx: Apache-2.0}
  huggingface-hub: {spdx: Apache-2.0}

  # [cloud-apis] — optional, not bundled in a default build
  anthropic: {spdx: MIT}
  openai: {spdx: Apache-2.0}
  google-generativeai: {spdx: Apache-2.0}

  # [compression]
  llmlingua: {spdx: MIT}

  # [cognition] — first-party, not on PyPI
  haloysius:
    spdx: LicenseRef-Halbert-FirstParty
    notes: "Sibling project by the same author; not third-party for licensing purposes."

  # [dev] — build-time only, never shipped
  pytest: {spdx: MIT, build_only: true}
  pytest-asyncio: {spdx: Apache-2.0, build_only: true}
  pyinstaller:
    spdx: GPL-2.0-or-later
    build_only: true
    notes: >-
      PyInstaller itself is GPL, but its bootloader carries a linking exception
      that explicitly permits distributing frozen applications under any licence.
      Build-time only — nothing of PyInstaller's own GPL code ends up in the
      shipped binary beyond the exception-covered bootloader.

  # Transitive dependencies pulled in by uvicorn[standard] and chromadb that are
  # worth pinning down because they are compiled into the frozen binary.
  uvloop: {spdx: MIT OR Apache-2.0}
  httptools: {spdx: MIT}
  websockets: {spdx: BSD-3-Clause}
  watchfiles: {spdx: MIT}
  python-dotenv: {spdx: BSD-3-Clause}
  onnxruntime: {spdx: MIT}
  tokenizers: {spdx: Apache-2.0}
  torch: {spdx: BSD-3-Clause}

  # [vision] — screen capture + webcam for vision model input
  mss:
    spdx: MIT
    notes: "Confirmed via PyPI metadata (license field + OSI classifier)."
  opencv-python:
    spdx: Apache-2.0
    notes: >-
      OpenCV itself is Apache-2.0; the wrapper scripts opencv-python adds are
      MIT (see LICENSE-3RD-PARTY.txt in the wheel). NEEDS FOUNDER REVIEW before
      an App Store submission that ships this extra: the published
      opencv-python wheels are documented (opencv/opencv-python#353 and the
      project's own wheel notes) to bundle an FFmpeg build under LGPL-2.1, and
      non-headless Linux wheels additionally bundle Qt5 under LGPL-3.0. This
      register's own SPDX-classification model only sees the top-level
      package's declared licence (Apache-2.0, permissive) — it does not model
      binary components bundled inside a wheel, so it cannot mechanically
      catch this the way it catches a declared LGPL *dependency*. Two things
      need a human legal call, not a script: (a) whether the macOS wheel
      actually used at build time is the one bundling FFmpeg or one built with
      WITH_FFMPEG=OFF relying on AVFoundation instead; (b) whether FFmpeg is
      linked dynamically (relinkable, satisfies LGPL) or statically inside
      that wheel, and whether the App Store's code-signing/sandboxing breaks
      the user's practical ability to relink. See "SONNET-05 additions" in
      DISPATCH-2026-09-01-FOUNDER-DECISIONS.md.

  # [audio-inference] — VAD/ASR/speaker-ID/audio-tagging/TTS via ONNX Runtime
  sherpa-onnx:
    spdx: Apache-2.0
    notes: >-
      Confirmed via PyPI metadata (license field states "Apache licensed, as
      found in the LICENSE file"). Its own runtime dependency onnxruntime is
      already registered above (MIT).

  # [audio-wake-word] — wake word spotting
  openwakeword:
    spdx: Apache-2.0
    notes: >-
      The package's own code is Apache-2.0 (OSI classifier confirmed via PyPI
      metadata) — permissive, fine for this register's purpose (software
      linked into the App Store binary). Separate, NOT a copyleft-code
      question this checker models: openwakeword's own docs state its
      default pretrained wake-word models use CC-BY-NC-4.0/CC-BY-NC-SA-4.0
      (non-commercial) due to training-data restrictions — a content-licensing
      concern analogous to LEG-CRIT-01 (the SS64 corpus quarantine), not a
      dependency-licence one. Halbert's own extra comment says it "requires a
      trained 'Hey Halbert' model" (i.e. a custom-trained model, not the
      stock ones) — flagged to the founder to confirm no default pretrained
      model ships or is downloaded as part of a commercial build. See
      "SONNET-05 additions" in DISPATCH-2026-09-01-FOUNDER-DECISIONS.md.

  # [audio-fingerprint] — acoustic fingerprinting via Chromaprint/AcoustID
  pyacoustid:
    spdx: MIT
    notes: >-
      Confirmed via PyPI metadata (SPDX field "MIT"). Needs the separately
      installed `chromaprint` C library at runtime (dynamically loaded via
      ctypes, not a pip/PyPI dependency — never appears in any manifest this
      checker parses, so it is not itself a register entry). chromaprint's own
      code is MIT, but it incorporates FFmpeg fragments under LGPL-2.1 and is
      commonly described as LGPL as a whole (acoustid/chromaprint#LICENSE.md).
      Not a blocker today: nothing in this repo bundles a compiled chromaprint
      binary into the App Store target, the user provides their own (e.g. via
      Homebrew). If a future build ever vendors/statically links chromaprint
      instead of dynamically loading the user's system copy, this needs the
      same LGPL relink-obligation review as opencv-python's bundled FFmpeg,
      above.

# -----------------------------------------------------------------------------
# Rust — halbert_core/halbert_core/dashboard/frontend/src-tauri/Cargo.toml
# -----------------------------------------------------------------------------
rust:
  tauri: {spdx: Apache-2.0 OR MIT}
  tauri-build: {spdx: Apache-2.0 OR MIT, build_only: true}
  tauri-plugin-opener: {spdx: Apache-2.0 OR MIT}
  tauri-plugin-shell: {spdx: Apache-2.0 OR MIT}
  serde: {spdx: MIT OR Apache-2.0}
  serde_json: {spdx: MIT OR Apache-2.0}
  sysinfo: {spdx: MIT}
  chrono: {spdx: MIT OR Apache-2.0}
  image: {spdx: MIT OR Apache-2.0}

  # `voice-capture` feature (opt-in, audio workstream T2.3)
  cpal:
    spdx: Apache-2.0
    notes: "Confirmed via crates.io metadata (license field)."

  # `aec` feature (opt-in, audio workstream T2.4) — neither feature is on by
  # default (Cargo.toml `[features] default = []`).
  webrtc-audio-processing:
    spdx: BSD-3-Clause
    notes: >-
      crates.io reports this crate's license as "non-standard" — that is a
      packaging technicality, not an unusual set of terms: Cargo.toml uses
      `license-file = "COPYING"` instead of an SPDX `license` string. Fetched
      COPYING directly (github.com/tonarino/webrtc-audio-processing) and it is
      Google's verbatim 2011 BSD-3-Clause text. The `aec` feature's `bundled`
      build compiles the vendored C++ submodule (PulseAudio's fork,
      gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing) — fetched its
      COPYING too and it is the identical BSD-3-Clause text. Both the Rust
      binding and the C++ it builds are BSD-3-Clause; nothing hidden under the
      "non-standard" label.

