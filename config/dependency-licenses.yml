# npm — halbert_core/halbert_core/dashboard/frontend/package.json
# -----------------------------------------------------------------------------
npm:
  # First-party — same author/copyright holder as halbert-core, same
  # convention as `haloysius` above (not a third-party dependency for
  # App Store §7-exception purposes; the exception is the project's own to
  # grant over its own code).
  "@halbert/design-system":
    spdx: LicenseRef-Halbert-FirstParty
    notes: "First-party monorepo package (packages/design-system), GPL-3.0-or-later, same author."
  "@halbert/model-picker":
    spdx: LicenseRef-Halbert-FirstParty
    notes: "First-party monorepo package (packages/model-picker), GPL-3.0-or-later, same author."

  "@monaco-editor/react": {spdx: MIT}
  "@radix-ui/react-alert-dialog": {spdx: MIT}
  "@radix-ui/react-dialog": {spdx: MIT}
  "@radix-ui/react-dropdown-menu": {spdx: MIT}
  "@radix-ui/react-label": {spdx: MIT}
  "@radix-ui/react-progress": {spdx: MIT}
  "@radix-ui/react-select": {spdx: MIT}
  "@radix-ui/react-separator": {spdx: MIT}
  "@radix-ui/react-slot": {spdx: MIT}
  "@radix-ui/react-switch": {spdx: MIT}
  "@radix-ui/react-tabs": {spdx: MIT}
  "@radix-ui/react-toast": {spdx: MIT}
  "@radix-ui/react-tooltip": {spdx: MIT}
  "@tauri-apps/api": {spdx: Apache-2.0 OR MIT}
  "@xterm/addon-fit": {spdx: MIT}
  "@xterm/addon-web-links": {spdx: MIT}
  "@xterm/xterm": {spdx: MIT}
  class-variance-authority: {spdx: Apache-2.0}
  clsx: {spdx: MIT}
  html2canvas: {spdx: MIT}
  lucide-react: {spdx: ISC}
  react: {spdx: MIT}
  react-dom: {spdx: MIT}
  react-router-dom: {spdx: MIT}
  recharts: {spdx: MIT}
  tailwind-merge: {spdx: MIT}
  tailwindcss-animate: {spdx: MIT}
  xterm: {spdx: MIT}
  xterm-addon-fit: {spdx: MIT}
  xterm-addon-web-links: {spdx: MIT}

  # devDependencies — build-time only, not shipped in the bundle
  "@tauri-apps/cli": {spdx: Apache-2.0 OR MIT, build_only: true}
  "@types/html2canvas": {spdx: MIT, build_only: true}
  "@types/react": {spdx: MIT, build_only: true}
  "@types/react-dom": {spdx: MIT, build_only: true}
  "@typescript-eslint/eslint-plugin": {spdx: MIT, build_only: true}
  "@typescript-eslint/parser": {spdx: MIT, build_only: true}
  "@vitejs/plugin-react": {spdx: MIT, build_only: true}
  autoprefixer: {spdx: MIT, build_only: true}
  eslint: {spdx: MIT, build_only: true}
  eslint-plugin-react-hooks: {spdx: MIT, build_only: true}
  eslint-plugin-react-refresh: {spdx: MIT, build_only: true}
  postcss: {spdx: MIT, build_only: true}
  tailwindcss: {spdx: MIT, build_only: true}
  typescript: {spdx: Apache-2.0, build_only: true}
  vite: {spdx: MIT, build_only: true}
  vitest: {spdx: MIT, build_only: true}
  jsdom: {spdx: MIT, build_only: true}
  "@testing-library/react": {spdx: MIT, build_only: true}
  "@testing-library/jest-dom": {spdx: MIT, build_only: true}
  "@testing-library/user-event": {spdx: MIT, build_only: true}

# -----------------------------------------------------------------------------
# Bundled assets
# -----------------------------------------------------------------------------
# Not a package-manager dependency: these files are committed to the repo and
# copied into every build, so they reach the App Store target without passing
# through any ecosystem manifest the checker already reads. Recorded here so a
# font added later cannot slip past the gate.
#
# Source of truth for the file list: shared-tokens/fonts/MANIFEST.json
bundled:
  Fraunces:
    spdx: OFL-1.1
    path: shared-tokens/fonts/
  "Space Grotesk":
    spdx: OFL-1.1
    path: shared-tokens/fonts/
  "JetBrains Mono":
    spdx: OFL-1.1
    path: shared-tokens/fonts/
