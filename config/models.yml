providers:
  ollama:
    base_url: http://localhost:11434
    timeout: 120

# ─────────────────────────────────────────────────────────────────────────────
# Hardware Tier Recommendations (Phase 58)
# ─────────────────────────────────────────────────────────────────────────────
#
# Tier 1 (RTX 4090 / 24GB VRAM): qwen2.5:14b chat, remote CLaRa, API specialist
# Tier 2 (RTX 5090 / 48GB+ VRAM): mistral-small chat, local CLaRa, local specialist
# Tier 3 (Apple Silicon 64GB+): mistral-small chat, local CLaRa, API/MLX specialist
#
# Run "Apply Recommended Config" in Settings to auto-configure for your hardware.

orchestrator:
  # Recommended: qwen2.5:14b (Tier 1) or mistral-small (Tier 2/3)
  model: qwen2.5:14b-instruct-q4_0  # Smart 14B model, ~8GB VRAM
  provider: ollama
  always_loaded: true
  purpose: Primary chat model, intent classification, simple Q&A, context selection

specialist:
  enabled: true
  # Recommended: API for Tier 1, local llama3.3:70b for Tier 2
  model: qwen2.5:32b  # Larger model for complex reasoning
  endpoint: http://100.74.58.17:11434
  purpose: Complex diagnostics, failure analysis, multi-step reasoning
  # Phase 32: To use a reasoning model (shows <think> blocks in UI), set model to:
  # - qwq:32b (QwQ reasoning model)
  # - deepseek-r1:70b (DeepSeek R1)
  # Reasoning models output chain-of-thought in collapsible "Reasoned for Xs" UI

vision:
  # Recommended: llama3.2-vision:11b or qwen3-v1:32b
  model: qwen3-v1:32b
  endpoint: http://100.74.58.17:11434  # Same as specialist endpoint
  purpose: Image analysis, screenshot interpretation, visual troubleshooting

# Phase 58: CLaRa Context Compression (optional, requires 14GB VRAM)
# DEPRECATED: Replaced by compression cascade (Phase 72 port from LinuxBrain)
clara:
  enabled: false  # Auto-enabled for Tier 2/3 systems (48GB+ VRAM)
  use_remote: true  # Use remote server for Tier 1 (24GB) systems
  model: apple/CLaRa-7B-Instruct  # Compression model, NOT a chat LLM
  remote_url: https://clara-remember-it-all.onrender.com  # Remote server
  compression_threshold: 4000  # Only compress contexts >4K tokens
  purpose: Compress RAG context 16x before sending to chat model

# Compression system (Phase 72 port from LinuxBrain — replaces CLaRa)
# 3-tier: LinguaCompressor (178MB neural) → SemanticCompressor (rule-based) → Noop
compression:
  enabled: true
  backend: auto  # auto | lingua | semantic | noop
  threshold: 4000  # Compress when context > this many tokens
  level: standard  # light | standard | aggressive
  lod_epistemic_floor: 0.8  # Never compress high-confidence memories below LOD 2

routing:
  strategy: auto
  prefer_specialist_for:
  - code_generation
  - code_analysis
  - reasoning
  - system_command
  complexity_threshold: 0.5

handoff:
  strategy: summarized
  max_context_tokens: 4096
  include_rag: true
  include_system_identity: true

persona_names:
  default: Linus
