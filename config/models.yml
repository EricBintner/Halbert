providers:
  ollama:
    base_url: http://localhost:11434
    timeout: 120

# ─────────────────────────────────────────────────────────────────────────────
# Model slots
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is a neutral template. Every `model:` value below is empty; slots
# with an empty model are ignored until a model is chosen in
# Settings → AI Models (which writes the user-level models.yml). Any model
# served by your endpoint can fill a slot; pick a size that fits your memory
# budget (roughly: a ~14B-parameter model at 4-bit quantization needs ~10 GB).

orchestrator:
  model: ""  # set in Settings → AI Models
  provider: ollama
  always_loaded: true
  purpose: Primary chat model, intent classification, simple Q&A, context selection

specialist:
  enabled: true
  model: ""  # set in Settings → AI Models
  endpoint: http://localhost:11434
  purpose: Complex diagnostics, failure analysis, multi-step reasoning
  # Phase 32: models that emit <think> blocks are supported; their reasoning is
  # shown in a collapsible "Reasoned for Xs" section in the UI.

vision:
  model: ""  # set in Settings → AI Models
  endpoint: http://localhost:11434  # Same as specialist endpoint
  purpose: Image analysis, screenshot interpretation, visual troubleshooting

# Compression system (Phase 72 port from LinuxBrain)
# 3-tier: LinguaCompressor (178MB neural) → SemanticCompressor (rule-based) → Noop
compression:
  enabled: true
  backend: auto  # auto | lingua | semantic | noop
  threshold: 4000  # Compress when context > this many tokens
  level: standard  # light | standard | aggressive
  lod_epistemic_floor: 0.8  # Never compress high-confidence memories below LOD 2

routing:
  strategy: auto
  prefer_specialist_for:
  - code_generation
  - code_analysis
  - reasoning
  - system_command
  complexity_threshold: 0.5

handoff:
  strategy: summarized
  max_context_tokens: 4096
  include_rag: true
  include_system_identity: true

persona_names:
  default: Linus
