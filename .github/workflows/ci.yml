name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # A gate is only worth having if nothing can walk past it. Every other job
  # below names the suites it runs; this one is the meta-gate that fails when a
  # test file exists that none of them would ever execute. It is what stops the
  # next new directory of tests from being green by never having run — the way
  # the whole root tests/ tree and the model-picker package once were.
  suite-census:
    name: Suite census (no test file escapes a gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pure stdlib, no install: this must be able to fail before anything
      # slower has had a chance to look green.
      #
      # Adding a job below means adding its suite to GATES here, or this fails.
      - name: Every test file is behind a gate
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          ROOT = Path(".").resolve()
          SKIP = {".git", "node_modules", ".venv", "venv", "__pycache__", "dist",
                  "build", ".pytest_cache", ".mypy_cache", "storybook-static"}

          # Every suite CI runs, as (path prefix, the job and command that runs it).
          GATES = [
              ("tests/",
               "job `test` -> pytest tests/"),
              ("halbert_core/tests/",
               "job `test` -> pytest tests/ in halbert_core/"),
              ("halbert_core/halbert_core/dashboard/frontend/src/",
               "job `dashboard-frontend` -> npm run test"),
              ("packages/model-picker/src/",
               "job `model-picker` -> npm test"),
              ("packages/design-system/src/",
               "job `design-system` -> npm test"),
          ]

          # Subtrees a gate's own command excludes again.
          IGNORED = {"tests/rag/": "--ignore=tests/rag/ on the root pytest run"}

          # Deliberately ungated, each with the reason it cannot be a CI gate.
          # An entry whose file has gone, or whose file turns out to be gated
          # after all, fails too: the list may not outlive its exemption.
          UNGATED = {
              "tests/rag/test_rag_system.py":
                  "builds a live embedding index, which downloads a model on first use",
          }

          def is_test_file(path):
              name = path.name
              if path.suffix == ".py":
                  return name.startswith("test_") or name.endswith("_test.py")
              if path.suffix in (".ts", ".tsx", ".js", ".jsx", ".mts", ".cts"):
                  parts = name.split(".")
                  return len(parts) > 2 and parts[-2] in ("test", "spec")
              return False

          def gate_for(rel):
              if any(rel.startswith(prefix) for prefix in IGNORED):
                  return None
              for prefix, gate in GATES:
                  if rel.startswith(prefix):
                      return gate
              return None

          found = sorted(
              path.relative_to(ROOT).as_posix()
              for path in ROOT.rglob("*")
              if path.is_file()
              and not any(part in SKIP for part in path.relative_to(ROOT).parts)
              and is_test_file(path)
          )

          problems = []
          for prefix, gate in GATES:
              if not (ROOT / prefix).is_dir():
                  problems.append(f"gate root {prefix} does not exist, so {gate} gates nothing")
          for rel in found:
              if rel not in UNGATED and gate_for(rel) is None:
                  problems.append(f"{rel} is run by no CI job -- add it to a gate, or to UNGATED with a reason")
          for rel in sorted(UNGATED):
              if not (ROOT / rel).exists():
                  problems.append(f"UNGATED lists {rel}, which no longer exists -- drop the exemption")
              elif gate_for(rel) is not None:
                  problems.append(f"UNGATED lists {rel}, but {gate_for(rel)} already runs it -- drop the exemption")

          by_gate = {}
          for rel in found:
              by_gate.setdefault(gate_for(rel) or "NOT RUN BY CI", []).append(rel)
          for gate in sorted(by_gate):
              print(f"{len(by_gate[gate]):4d}  {gate}")
          print(f"{len(found):4d}  test files in the tree")
          for rel in by_gate.get("NOT RUN BY CI", []):
              print(f"      exempt: {rel} -- {UNGATED.get(rel, 'NO REASON GIVEN')}")
          sys.stdout.flush()

          if problems:
              print("\nTest files have escaped CI:", file=sys.stderr)
              for line in problems:
                  print(f"  - {line}", file=sys.stderr)
              sys.exit(1)
          print("\nEvery test file is behind a gate or an explained exemption.")
          PY

  design-tokens:
    name: Design tokens (WCAG gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pure stdlib — no install step needed. Verifies every licensed
      # colour pair in shared-tokens/tokens.css against its WCAG floor in
      # both themes, and guards the two dark blocks against drifting apart.
      - name: Check contrast
        run: python3 scripts/check_contrast.py --verbose
      # The dashboard's shadcn slots are generated from the same tokens.
      - name: Check the shadcn theme is in sync
        run: python3 scripts/gen_shadcn_theme.py --check
      # Ratchet: existing literal-colour debt may sit, but it may not grow.
      - name: Check no new literal palette classes
        run: python3 scripts/check_literal_colors.py --check
      # The typefaces are redistributed, so their integrity is a licence
      # matter as well as a rendering one.
      - name: Check vendored fonts match their manifest
        run: python3 scripts/vendor_fonts.py --verify
      - name: Check each app's font copy is in sync
        run: python3 scripts/sync_fonts.py --check

  design-system:
    name: Design system (types + a11y contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      # Catches a story that no longer compiles against its component.
      - run: npm run build-storybook -- --quiet

  model-picker:
    name: Model picker (types + boundary + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/model-picker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      # The boundary check is what keeps the package extractable: it fails on
      # any import that reaches back into the dashboard it currently ships in.
      - run: npm run check:boundary
      - run: npm test

  dashboard-frontend:
    name: Dashboard frontend (types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halbert_core/halbert_core/dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The picker is consumed from source through a vite alias and a tsconfig
      # path, not an npm workspace, so tsc resolves react from the package's
      # own node_modules and reports it missing unless they are installed too.
      - name: Install the aliased picker's deps
        working-directory: packages/model-picker
        run: npm install
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run test

  test:
    name: Backend (root + halbert_core suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # [dev] carries pytest-asyncio, without which all 140 async tests
          # in the suite error out rather than run. [vision] carries mss +
          # opencv-python: without it, test_cv_extensions.py and
          # test_vision_tools.py (13 tests) fail on ModuleNotFoundError,
          # not on a real defect — the feature itself is shipped.
          pip install -e "halbert_core/[dashboard,dev,vision]"
      # tests/rag/ stays out: it builds a live embedding index, which downloads
      # a model on first use.
      - name: Run root tests
        run: pytest tests/ -q --ignore=tests/rag/
      # Where the backend suite actually lives — the root tests/ tree above is
      # an older remnant, and running only it left 1296 tests unrun.
      - name: Run halbert_core tests
        working-directory: halbert_core
        run: pytest tests/ -q

  rust-tauri:
    name: Rust (Tauri shell unit tests)
    # 28 #[test]s live in src-tauri/src (lib.rs, hud_hotkey.rs, audio_capture.rs,
    # floating_panel.rs) and were never run in CI. macos-latest is required: the
    # crate's objc2/AppKit bindings (hud_hotkey.rs, floating_panel.rs) only build
    # on macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: halbert_core/halbert_core/dashboard/frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            halbert_core/halbert_core/dashboard/frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('halbert_core/halbert_core/dashboard/frontend/src-tauri/Cargo.lock') }}
      # Default features only (no voice-capture/aec): those pull in cpal and
      # webrtc-audio-processing, which need clang/pkg-config/meson/ninja on the
      # runner image and are opt-in, unbuilt-by-default audio-workstream code.
      - run: cargo test --locked

  marketing-web-v7:
    name: Marketing web-v7 (build smoke)
    # No test/typecheck scripts exist for this app (plain JS, no tsconfig), and
    # it consumes @halbert/design-system straight from source via a vite alias
    # — a build here is the cheapest gate against a design-system API change
    # silently breaking the marketing site.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing/web-v7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
