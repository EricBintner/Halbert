name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  design-tokens:
    name: Design tokens (WCAG gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pure stdlib — no install step needed. Verifies every licensed
      # colour pair in shared-tokens/tokens.css against its WCAG floor in
      # both themes, and guards the two dark blocks against drifting apart.
      - name: Check contrast
        run: python3 scripts/check_contrast.py --verbose
      # The dashboard's shadcn slots are generated from the same tokens.
      - name: Check the shadcn theme is in sync
        run: python3 scripts/gen_shadcn_theme.py --check
      # Ratchet: existing literal-colour debt may sit, but it may not grow.
      - name: Check no new literal palette classes
        run: python3 scripts/check_literal_colors.py --check
      # The typefaces are redistributed, so their integrity is a licence
      # matter as well as a rendering one.
      - name: Check vendored fonts match their manifest
        run: python3 scripts/vendor_fonts.py --verify
      - name: Check each app's font copy is in sync
        run: python3 scripts/sync_fonts.py --check

  design-system:
    name: Design system (types + a11y contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      # Catches a story that no longer compiles against its component.
      - run: npm run build-storybook -- --quiet

  model-picker:
    name: Model picker (types + boundary + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/model-picker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      # The boundary check is what keeps the package extractable: it fails on
      # any import that reaches back into the dashboard it currently ships in.
      - run: npm run check:boundary
      - run: npm test

  dashboard-frontend:
    name: Dashboard frontend (types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halbert_core/halbert_core/dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The picker is consumed from source through a vite alias and a tsconfig
      # path, not an npm workspace, so tsc resolves react from the package's
      # own node_modules and reports it missing unless they are installed too.
      - name: Install the aliased picker's deps
        working-directory: packages/model-picker
        run: npm install
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # [dev] carries pytest-asyncio, without which all 140 async tests
          # in the suite error out rather than run.
          pip install -e "halbert_core/[dashboard,dev]"
      # tests/rag/ stays out: it builds a live embedding index, which downloads
      # a model on first use.
      - name: Run root tests
        run: pytest tests/ -q --ignore=tests/rag/
      # Where the backend suite actually lives — the root tests/ tree above is
      # an older remnant, and running only it left 1296 tests unrun.
      - name: Run halbert_core tests
        working-directory: halbert_core
        run: pytest tests/ -q
